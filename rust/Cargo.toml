[package]
name = "meanders"
version = "0.1.0"
edition = "2024"
description = "Parallel transfer-matrix counter for Arnold's open meanders (OEIS A005316)"

[[bin]]
name = "meanders-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[dependencies]
libc = "0.2"
